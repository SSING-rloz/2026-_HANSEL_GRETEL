# HANSEL/GRETEL Head Pi - hostapd configuration
# Target:
#   Raspberry Pi 4
#   Debian GNU/Linux 13 trixie
#   wlan0 as AP-only interface
#
# WARNING:
#   Applying this file and starting hostapd will switch wlan0 away from
#   Wi-Fi client mode. If SSH is currently connected through wlan0,
#   the SSH session may disconnect.

##### Interface / driver #####

interface=wlan0
driver=nl80211

##### Regulatory domain #####

country_code=KR
ieee80211d=1

##### Basic AP settings #####

ssid=HANSEL_HEAD_AP
hw_mode=g
channel=6

# 0 = broadcast SSID normally
# 1 = hide SSID
ignore_broadcast_ssid=0

##### 802.11n / Wi-Fi 4 #####

ieee80211n=1
wmm_enabled=1

##### WPA2-PSK security #####

# WPA mode:
#   1 = WPA
#   2 = WPA2 / RSN
#   3 = WPA + WPA2 mixed
wpa=2

# WPA/WPA2 passphrase must be 8 to 63 ASCII characters.
wpa_passphrase=12345678

wpa_key_mgmt=WPA-PSK

# Use CCMP/AES for WPA2.
# Avoid TKIP unless old clients require it.
rsn_pairwise=CCMP

##### Open AP option #####
# To convert this AP to an open network later:
#   1. Comment out or remove the WPA2 block above:
#        wpa=2
#        wpa_passphrase=...
#        wpa_key_mgmt=WPA-PSK
#        rsn_pairwise=CCMP
#   2. Keep only the interface, country, SSID, hw_mode, and channel settings.
#
# Do NOT use Open AP for field testing unless you intentionally want
# unauthenticated clients to connect.
