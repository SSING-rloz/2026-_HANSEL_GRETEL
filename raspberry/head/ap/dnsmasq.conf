# HANSEL/GRETEL Head Pi - dnsmasq configuration
# Target:
#   Raspberry Pi 4
#   Debian GNU/Linux 13 trixie
#   wlan0 as AP-only interface
#
# Purpose:
#   Provide DHCP leases to controller PC / phone / relay Pi devices
#   connected to HANSEL_HEAD_AP.
#
# WARNING:
#   Do not start dnsmasq before wlan0 has 192.168.4.1/24.
#   If wlan0 is currently used for SSH as a Wi-Fi client, switching it
#   to AP mode may disconnect the SSH session.

##### Interface binding #####

# Serve DHCP/DNS only on the AP interface.
interface=wlan0

# Listen on the Head Pi AP address only.
# This address must be assigned to wlan0 before dnsmasq is started.
listen-address=192.168.4.1

# Bind only to the selected interface/address.
# This prevents dnsmasq from unintentionally serving other interfaces.
bind-interfaces

##### Fixed deployment address policy #####
#
# MVP deployment uses FIXED addresses for the core robot units so that boot
# automation (systemd services, relay destinations, detach bridge) can rely on
# stable IPs without waiting for MAC-based DHCP reservations.
#
#   Head Pi AP   : 192.168.4.1   (assigned by start_ap.sh, not by DHCP)
#   Node1 Pi     : 192.168.4.11  (static, set on the node via NetworkManager)
#   Node2 Pi     : 192.168.4.12  (static, set on the node via NetworkManager)
#   Node3 Pi     : 192.168.4.13  (static, set on the node via NetworkManager)
#   Android phone: 192.168.4.20  (USER sets this MANUALLY in the phone's
#                                 HANSEL_HEAD_AP Wi-Fi settings as a static IP;
#                                 this is NOT a dnsmasq reservation)
#
# The Node and phone static addresses are configured on those devices
# themselves (Node: raspberry/nodeN/net/setup_static_ip.sh; phone: manual
# Wi-Fi static IP). They are intentionally OUTSIDE the dynamic pool below so
# they never collide with a DHCP-assigned lease.
#
# NOTE: MAC-based dhcp-host= reservations are still a deferred documentation
# item. Once node wlan0 MACs are known they MAY be added here, but they are not
# required because the nodes set their own static IP.

##### DHCP range #####

# Format:
#   dhcp-range=<start>,<end>,<netmask>,<lease time>
#
# AP subnet:
#   192.168.4.0/24
#
# Head Pi AP IP:
#   192.168.4.1
#
# Dynamic client pool (moved to .100-.150 to avoid colliding with the fixed
# .1/.11/.12/.13/.20 deployment addresses above):
#   192.168.4.100 - 192.168.4.150
dhcp-range=192.168.4.100,192.168.4.150,255.255.255.0,12h

##### DHCP options #####

# Default gateway advertised to clients.
# NAT is not configured in the current step, so this does NOT provide
# internet access yet. It only points clients at the Head Pi as the
# AP-side gateway for future routing/NAT steps.
dhcp-option=option:router,192.168.4.1

# DNS server advertised to clients.
# For now, clients will use the Head Pi as DNS.
dhcp-option=option:dns-server,192.168.4.1

##### AP-local behavior #####

# This AP network is intended to be controlled by this dnsmasq instance.
# This can make DHCP assignment faster when clients join/rejoin.
dhcp-authoritative

##### Optional debugging #####

# Uncomment during testing if you want DHCP lease logs.
# This can be useful when checking whether phone/PC/relay Pi devices
# are actually receiving addresses.
#log-dhcp
