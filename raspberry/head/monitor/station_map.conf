# HANSEL/GRETEL Head Pi - auto-detach station map
#
# Used by detach_bridge.py to translate a degrading station's wlan0 MAC
# (as reported by link_guard.py: station=<MAC>) into the node control server
# it should send "detach_press" to (UDP <IP>:5000).
#
# Format (whitespace separated), one entry per line:
#   <wlan0_MAC>  <node_IP>  <node_name>
#
# Fixed deployment IPs (see dnsmasq.conf / nodeN/net/setup_static_ip.sh):
#   Node1 -> 192.168.4.11
#   Node2 -> 192.168.4.12
#   Node3 -> 192.168.4.13
#
# !!! DECISION REQUIRED ON REAL HARDWARE !!!
# The node wlan0 MAC addresses are not known yet. Until you fill in the real
# MACs below, detach_bridge.py will log "unknown_station ... action=skip" and
# perform NO detach. Get each node's MAC on the node with:
#     cat /sys/class/net/wlan0/address
# then uncomment and correct the lines below.
#
# Example (REPLACE the MACs with the real ones):
B8:27:EB:B6:CF:91  192.168.4.11  NODE1
B8:27:EB:79:2F:2F  192.168.4.12  NODE2
B8:27:EB:89:BC:5A  192.168.4.13  NODE3


